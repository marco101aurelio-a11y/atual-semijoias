<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae59f"/>
      <stop offset="35%" stop-color="#e3be66"/>
      <stop offset="70%" stop-color="#c99a32"/>
      <stop offset="100%" stop-color="#8e6516"/>
    </linearGradient>
    <linearGradient id="goldGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#fae59f"/>
      <stop offset="100%" stop-color="#c99a32"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#goldGlow)"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.6"/>

  <g transform="translate(250, 165)" filter="url(#goldGlow)">
    <path d="M0,-52 C-20,-18 -26,15 0,38 C26,15 20,-18 0,-52 Z" fill="none" stroke="url(#goldGradLight)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-6,15 C-38,12 -58,-10 -42,-38 C-30,-12 -16,2 -6,15 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M6,15 C38,12 58,-10 42,-38 C30,-12 16,2 6,15 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="3.5" fill="url(#goldGradLight)"/>
  </g>

  <text x="250" y="296" text-anchor="middle" font-family="'Montserrat', 'Playfair Display', sans-serif" font-size="64" font-weight="300" letter-spacing="2" fill="#ffffff">
    atual
  </text>
  
  <text x="250" y="336" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="15" font-weight="600" letter-spacing="12" fill="url(#goldGrad)">
    SEMIJOIAS
  </text>

  <line x1="170" y1="358" x2="330" y2="358" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8"/>
  <polygon points="250,355 253,358 250,361 247,358" fill="url(#goldGrad)"/>
</svg>